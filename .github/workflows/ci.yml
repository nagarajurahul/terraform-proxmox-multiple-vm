name: CI

on:
  push:
    branches: [ main, multiple-layers ]
  pull_request:
    branches: [ main, multiple-layers ]
  workflow_dispatch:


env:
  # verbosity setting for Terraform logs
  TF_LOG: INFO
  TERRAFORM_VERSION: "1.13.5"

jobs:
  #############################################
  # Job 0: Detect Changed Tiers
  #############################################
  detect-changes:
    name: Detect Changed Tiers
    runs-on: ubuntu-latest
    outputs:
      tiers: ${{ steps.set-tiers.outputs.tiers }}
      any_changed: ${{ steps.set-tiers.outputs.any_changed }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect changed tiers
      id: set-tiers
      shell: bash
      run: |
        echo "🔍 Detecting changed tiers..."

        # Define known tiers
        ALL_TIERS='["environments/prod/core-services","environments/prod/platform-services","environments/prod/workload-services"]'

        ###########################################
        # 1. workflow_dispatch OR push to main/multiple-layers → always run all tiers
        ###########################################
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
           ([[ "${{ github.event_name }}" == "push" ]] && \
           ([[ "${{ github.ref }}" == "refs/heads/main" ]] || \
            [[ "${{ github.ref }}" == "refs/heads/multiple-layers" ]])); then

          echo "tiers=$(echo $ALL_TIERS | jq -c)" >> $GITHUB_OUTPUT
          echo "any_changed=true" >> $GITHUB_OUTPUT
          echo "🔵 Running all tiers due to main push or workflow_dispatch"
          exit 0
        fi

        ###########################################
        # 2. Detect changed files depending on event type
        ###########################################
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          BASE="${{ github.base_ref }}"
          git fetch origin $BASE
          CHANGED_FILES=$(git diff --name-only origin/$BASE...HEAD)
        else
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
        fi

        echo "Changed files:"
        echo "$CHANGED_FILES"

        CHANGED_TIERS="[]"

        ###########################################
        # 3. Detect per-tier changes
        ###########################################
        for tier in "environments/prod/core-services" "environments/prod/platform-services" "environments/prod/workload-services"; do
          if echo "$CHANGED_FILES" | grep -q "^${tier}/"; then
            CHANGED_TIERS=$(echo "$CHANGED_TIERS" | jq -c --arg t "$tier" '. + [$t]')
          fi
        done

        ###########################################
        # 4. Shared files or modules changes → all tiers
        ###########################################
        if echo "$CHANGED_FILES" | grep -qE "^environments/prod/_shared/|^modules/"; then
          CHANGED_TIERS=$(echo "$ALL_TIERS" | jq -c)
        fi

        ###########################################
        # 5. Filter out tiers that DO NOT exist
        ###########################################
        VALID_TIERS="[]"

        for tier in "environments/prod/core-services" "environments/prod/platform-services" "environments/prod/workload-services"; do
          if [ -d "$tier" ]; then
            if echo "$CHANGED_TIERS" | grep -q "$tier"; then
              VALID_TIERS=$(echo "$VALID_TIERS" | jq -c --arg t "$tier" '. + [$t]')
            fi
          fi
        done

        CHANGED_TIERS=$VALID_TIERS
        echo "Valid tiers: $CHANGED_TIERS"

        ###########################################
        # 6. Set GitHub outputs
        ###########################################
        if [[ "$CHANGED_TIERS" == "[]" ]]; then
          echo "any_changed=false" >> $GITHUB_OUTPUT
          echo "tiers=[]" >> $GITHUB_OUTPUT
          echo "🟡 No Terraform changes detected"
        else
          echo "any_changed=true" >> $GITHUB_OUTPUT
          echo "tiers=$CHANGED_TIERS" >> $GITHUB_OUTPUT
          echo "🟢 Changed tiers: $CHANGED_TIERS"
        fi

  #############################################
  # Job 1: Terraform Format (repo-wide)
  #############################################
  terraform-format:
    name: Terraform Format
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}

    - name: Terraform Format Check
      id: fmt
      run: terraform fmt -check -recursive

    - name: Comment PR - Format Check
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '❌ **Terraform Format Check Failed**\n\nPlease run `terraform fmt -recursive` to fix formatting issues.'
          })

  #############################################
  # Job 2: Terraform Validate (per-tier)
  #############################################
  terraform-validate:
    name: Validate - ${{ matrix.tier }}
    runs-on: ubuntu-latest
    needs: [ detect-changes, terraform-format ]
    if: needs.detect-changes.outputs.any_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ fromJson(needs.detect-changes.outputs.tiers) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}

    - name: Terraform Init
      working-directory: ${{ matrix.tier }}
      run: terraform init -backend=false

    - name: Terraform Validate
      working-directory: ${{ matrix.tier }}
      run: terraform validate -no-color

  #############################################
  # Job 3: TFLint (per-tier)
  #############################################
  tflint:
    name: TFLint - ${{ matrix.tier }}
    runs-on: ubuntu-latest
    needs: [ detect-changes ]
    if: needs.detect-changes.outputs.any_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ fromJson(needs.detect-changes.outputs.tiers) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache TFLint plugins
      uses: actions/cache@v4
      with:
        path: ~/.tflint.d/plugins
        key: ${{ runner.os }}-tflint-${{ hashFiles('.tflint.hcl') }}

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v4
      with:
        tflint_version: latest

    - name: Initialize TFLint
      working-directory: ${{ matrix.tier }}
      run: tflint --init

    - name: Run TFLint
      working-directory: ${{ matrix.tier }}
      run: tflint --format compact

  #############################################
  # Job 4: Security Scanning - tfsec (per-tier)
  #############################################
  tfsec:
    name: tfsec - ${{ matrix.tier }}
    runs-on: ubuntu-latest
    needs: [ detect-changes ]
    if: needs.detect-changes.outputs.any_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ fromJson(needs.detect-changes.outputs.tiers) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run tfsec
      uses: aquasecurity/tfsec-action@v1.0.3
      with:
        working_directory: ${{ matrix.tier }}
        additional_args: --format lovely

  #############################################
  # Job 5: Checkov Security Scan (per-tier)
  #############################################
  checkov:
    name: Checkov - ${{ matrix.tier }}
    runs-on: ubuntu-latest
    needs: [ detect-changes ]
    if: needs.detect-changes.outputs.any_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ fromJson(needs.detect-changes.outputs.tiers) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Checkov
      uses: bridgecrewio/checkov-action@v12
      with:
        directory: ${{ matrix.tier }}
        framework: terraform
        quiet: true
        soft_fail: false

  #############################################
  # Job 6: Terraform Docs (per-tier)
  #############################################
  terraform-docs:
    name: Docs - ${{ matrix.tier }}
    runs-on: ubuntu-latest
    needs: [ detect-changes ]
    if: needs.detect-changes.outputs.any_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        tier: ${{ fromJson(needs.detect-changes.outputs.tiers) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.ref || github.ref }}

    - name: Generate terraform docs
      uses: terraform-docs/gh-actions@v1.2.0
      with:
        working-dir: ${{ matrix.tier }}
        output-file: README.md
        output-method: inject
        git-push: false

    - name: Check if docs changed
      id: docs-check
      working-directory: ${{ matrix.tier }}
      run: |
        git diff --exit-code README.md || echo "changed=true" >> $GITHUB_OUTPUT

    - name: Comment PR if docs need update
      if: github.event_name == 'pull_request' && steps.docs-check.outputs.changed == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const tier = '${{ matrix.tier }}'.split('/').pop();
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `📝 **Documentation Update Required for ${tier}**\n\nPlease run:\n\`\`\`bash\ncd ${{ matrix.tier }}\nterraform-docs markdown table . --output-file README.md\n\`\`\``
          })

  #############################################
  # Final Status Check
  #############################################
  ci-success:
    name: CI Success
    needs:
    - detect-changes
    - terraform-format
    - terraform-validate
    - tflint
    - tfsec
    - checkov
    - terraform-docs
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Check CI Status
      run: |
        # Skip validation checks if no tiers changed
        if [[ "${{ needs.detect-changes.outputs.any_changed }}" != "true" ]]; then
          echo "✅ No Terraform changes detected, skipping validation"
          exit 0
        fi

        # Check required jobs
        if [[ "${{ needs.terraform-format.result }}" != "success" ]]; then
          echo "❌ Terraform format check failed"
          exit 1
        fi

        if [[ "${{ needs.terraform-validate.result }}" != "success" ]]; then
          echo "❌ Terraform validation failed"
          exit 1
        fi

        if [[ "${{ needs.tflint.result }}" != "success" ]]; then
          echo "❌ TFLint failed"
          exit 1
        fi

        if [[ "${{ needs.tfsec.result }}" != "success" ]]; then
          echo "❌ tfsec security scan failed"
          exit 1
        fi

        if [[ "${{ needs.checkov.result }}" != "success" ]]; then
          echo "❌ Checkov security scan failed"
          exit 1
        fi

        echo "✅ All CI checks passed"
